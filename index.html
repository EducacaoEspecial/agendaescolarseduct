<title>Agenda de Creches e Escolas</title>

<style>
:root{
  --bg:#f4f7fb; --card:#fff; --text:#183044; --muted:#64748b; --line:#dbe4ee;
  --primary:#0f4c81; --primary2:#1769aa; --accent:#f4b942; --school:#e8f2ff; --creche:#fff3dd;
  --shadow:0 8px 28px rgba(15,76,129,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  background:linear-gradient(135deg,var(--primary),#0a365d);
  color:#fff;padding:22px 18px 28px;box-shadow:0 4px 18px rgba(0,0,0,.12)
}
.header-inner{max-width:1200px;margin:auto}
.brand{display:flex;gap:14px;align-items:center}
.brand-icon{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-size:27px}
h1{font-size:clamp(1.45rem,4vw,2.15rem);margin:0 0 4px}
.subtitle{margin:0;color:#d9ebf9;font-size:.95rem}
main{max-width:1200px;margin:-14px auto 40px;padding:0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.search-wrap{position:relative}
.search-wrap input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:13px;padding:0 44px 0 44px;outline:none;background:#fff;color:var(--text)}
.search-wrap input:focus{border-color:#69a9df;box-shadow:0 0 0 4px rgba(23,105,170,.11)}
.search-icon{position:absolute;left:15px;top:13px;font-size:20px;opacity:.65}
.clear-search{position:absolute;right:9px;top:7px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#64748b;font-size:18px}
.top-action{height:48px;border:1px solid #cbd5e1;background:#fff;border-radius:13px;padding:0 14px;color:var(--primary);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:8px 13px;font-weight:650}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.filters select{border:1px solid #cbd5e1;background:#fff;border-radius:11px;padding:8px 34px 8px 11px;color:#334155;max-width:260px}
.spacer{flex:1}
.link-btn{border:0;background:transparent;color:var(--primary);font-weight:700;padding:8px}
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:.93rem}
.summary strong{color:var(--text)}
.result-count{margin-right:auto}
.mini-stat{background:#eef4f9;border-radius:999px;padding:5px 9px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 3px 14px rgba(31,52,73,.05);display:flex;flex-direction:column;min-height:250px}
.card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(31,52,73,.09)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:800}
.badge.school{background:var(--school);color:#0d5b9d}
.badge.creche{background:var(--creche);color:#8b5a00}
.star{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:#a9b5c1;padding:2px 3px}
.star.on{color:#e7a100}
.unit{font-weight:800;font-size:1.03rem;line-height:1.33;margin:10px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:.82rem;margin-bottom:10px}
.info{border-top:1px solid #edf1f5;padding-top:9px;margin-top:2px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#8392a4;font-weight:800;margin-bottom:2px}
.value{font-size:.92rem;line-height:1.35;overflow-wrap:anywhere}
.phone-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px}
.phone{font-weight:750;color:var(--primary)}
.icon-action{border:1px solid #d9e3ec;background:#f8fbfd;border-radius:9px;padding:5px 8px;color:#234e70;font-size:.82rem;text-decoration:none}
.icon-action:hover{background:#edf6fc}
.card-footer{display:flex;gap:8px;margin-top:auto;padding-top:13px}
.details-btn{flex:1;border:1px solid #c9d8e5;background:#fff;color:var(--primary);font-weight:800;border-radius:10px;padding:8px 10px}
.copy-btn{border:0;background:#eaf3fa;color:var(--primary);font-weight:800;border-radius:10px;padding:8px 10px}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #b9c9d8;border-radius:16px;padding:44px 16px;color:var(--muted)}
footer{max-width:1200px;margin:0 auto 32px;padding:0 16px;color:#7a8a99;text-align:center;font-size:.82rem}
.modal-backdrop{position:fixed;inset:0;background:rgba(12,29,44,.52);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-backdrop.open{display:flex}
.modal{background:#fff;width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
.modal-head{display:flex;gap:10px;align-items:flex-start;padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-weight:850;font-size:1.15rem;line-height:1.3}
.modal-close{margin-left:auto;border:0;background:#eef3f7;border-radius:10px;width:38px;height:38px;font-size:20px;color:#40566a}
.modal-body{padding:18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.detail{background:#f7f9fb;border:1px solid #e3eaf0;border-radius:12px;padding:11px}
.detail.wide{grid-column:1/-1}
.detail .label{margin-bottom:5px}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.action-primary,.action-secondary{border-radius:10px;padding:9px 12px;font-weight:800;text-decoration:none}
.action-primary{background:var(--primary);color:white;border:1px solid var(--primary)}
.action-secondary{background:white;color:var(--primary);border:1px solid #c9d8e5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#172b3b;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:200;font-size:.9rem;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
mark{background:#ffe69b;color:inherit;padding:0 1px;border-radius:3px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){
  header{padding:18px 14px 26px}.brand-icon{width:44px;height:44px}
  main{padding:0 10px}.panel{padding:12px;border-radius:16px}.search-row{grid-template-columns:1fr}
  .top-action{display:none}.filters select{max-width:100%;flex:1}.spacer{display:none}
  .grid{grid-template-columns:1fr}.card{min-height:0}.detail-grid{grid-template-columns:1fr}.detail.wide{grid-column:auto}
}
@media print{
  header,.panel,.card-footer,.star,.icon-action,footer,.modal-backdrop,.toast{display:none!important}
  body{background:white}.grid{display:block}.card{break-inside:avoid;box-shadow:none;margin:0 0 8px;border-color:#aaa;min-height:0}
  main{max-width:none;margin:0;padding:0}.summary{margin:0 0 10px}.summary .mini-stat{display:none}
}
</style>
</head>

<header>

      <div>

      </div>

  </div>

<main>

        <option value="diretor">Ordenar: direção</option>
      </select>
      <span class="spacer"></span>
      <button class="link-btn" id="clearFilters">Limpar filtros</button>
    </div>
  </section>

  <div class="summary" aria-live="polite">
    <span class="result-count" id="resultCount"></span>
    <span class="mini-stat" id="schoolStat"></span>
    <span class="mini-stat" id="crecheStat"></span>
  </div>

  <section class="grid" id="grid" aria-label="Lista de unidades"></section>
</main>

<footer>
  Dados incorporados da planilha “TELEFONES CRECHES E ESCOLAS.xlsx”. Arquivo independente e utilizável offline.
</footer>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <div class="modal-title" id="modalTitle"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = { type:"Todos", favoritesOnly:false, bairro:"", search:"", sort:"unidade" };
const favoriteKey = "agenda-unidades-favoritos-v1";
let favorites = new Set(JSON.parse(localStorage.getItem(favoriteKey) || "[]"));

function norm(v){
  return String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function digits(v){ return String(v ?? "").replace(/\D/g,""); }
function validText(v){ const x=String(v??"").trim(); return x && x!=="-" ? x : ""; }
function idFor(r){ return `${r.tipo}|${r.inep}|${r.unidade}`; }
function display(v, fallback="—"){ const x=validText(v); return x || fallback; }
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function phoneHref(v){ const d=digits(v); return d ? `tel:${d}` : ""; }
function whatsappHref(v){
  let d=digits(v);
  if(!d) return "";
  if(d.startsWith("55") && d.length>=12) return `https://wa.me/${d}`;
  if(d.length===10 || d.length===11) return `https://wa.me/55${d}`;
  if(d.length===8 || d.length===9) return `https://wa.me/5522${d}`;
  return "";
}
function googleMapsHref(address){
  const q = validText(address);
  return q ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + ", Campos dos Goytacazes RJ")}` : "";
}
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800);
}
async function copyText(text, msg="Copiado"){
  try{ await navigator.clipboard.writeText(text); toast(msg); }
  catch{
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); toast(msg);
  }
}
function makeSearchBlob(r){
  return norm([
    r.tipo,r.unidade,r.inep,r.telefone_unidade,r.diretor,r.telefone_diretor,
    r.adjunto1,r.telefone_adjunto1,r.adjunto2,r.telefone_adjunto2,r.endereco,r.bairro
  ].join(" "));
}
DATA.forEach(r=>r._search=makeSearchBlob(r));

function fillBairros(){
  const map=new Map();
  DATA.forEach(r=>{
    const b=validText(r.bairro);
    if(!b) return;
    const key=norm(b).replace(/\.$/,"");
    if(!map.has(key)) map.set(key,b.replace(/\.$/,""));
  });
  [...map.entries()].sort((a,b)=>a[1].localeCompare(b[1],"pt-BR")).forEach(([key,label])=>{
    const o=document.createElement("option"); o.value=key; o.textContent=label; $("#bairroFilter").appendChild(o);
  });
}

function filtered(){
  const q=norm(state.search);
  let arr=DATA.filter(r=>{
    if(state.type!=="Todos" && r.tipo!==state.type) return false;
    if(state.favoritesOnly && !favorites.has(idFor(r))) return false;
    if(state.bairro && norm(r.bairro).replace(/\.$/,"")!==state.bairro) return false;
    if(q && !r._search.includes(q)) return false;
    return true;
  });
  const field=state.sort;
  arr.sort((a,b)=>display(a[field],"").localeCompare(display(b[field],""),"pt-BR",{sensitivity:"base"}));
  return arr;
}

function phoneActions(value){
  const p=validText(value);
  if(!p) return "";
  const wa=whatsappHref(p), tel=phoneHref(p);
  return `<span class="phone-line">
    <span class="phone">${esc(p)}</span>
    ${tel?`<a class="icon-action" href="${tel}" title="Ligar">☎ Ligar</a>`:""}
    ${wa?`<a class="icon-action" href="${wa}" target="_blank" rel="noopener" title="Abrir no WhatsApp">WhatsApp</a>`:""}
    <button class="icon-action" data-copy="${esc(p)}" title="Copiar telefone">Copiar</button>
  </span>`;
}

function card(r){
  const id=idFor(r), fav=favorites.has(id), isCreche=r.tipo==="Creche";
  return `<article class="card">
    <div class="card-top">
      <span class="badge ${isCreche?"creche":"school"}">${isCreche?"Creche":"Escola"}</span>
      <button class="star ${fav?"on":""}" data-fav="${esc(id)}" title="${fav?"Remover dos favoritos":"Adicionar aos favoritos"}" aria-label="Favorito">${fav?"★":"☆"}</button>
    </div>
    <div class="unit">${esc(r.unidade)}</div>
    <div class="meta">
      ${validText(r.bairro)?`<span>📍 ${esc(r.bairro)}</span>`:""}
      ${validText(r.inep)?`<span>INEP ${esc(r.inep)}</span>`:""}
    </div>
    <div class="info">
      <div class="label">Telefone da unidade</div>
      <div class="value">${phoneActions(r.telefone_unidade) || "—"}</div>
    </div>
    <div class="info">
      <div class="label">Direção</div>
      <div class="value">${esc(display(r.diretor))}</div>
      <div class="value">${phoneActions(r.telefone_diretor)}</div>
    </div>
    <div class="card-footer">
      <button class="details-btn" data-detail="${esc(id)}">Ver detalhes</button>
      <button class="copy-btn" data-copy-card="${esc(id)}" title="Copiar resumo">Copiar</button>
    </div>
  </article>`;
}

function render(){
  const arr=filtered();
  $("#resultCount").innerHTML=`<strong>${arr.length}</strong> ${arr.length===1?"unidade encontrada":"unidades encontradas"}`;
  $("#schoolStat").textContent=`${arr.filter(r=>r.tipo==="Escola").length} escolas`;
  $("#crecheStat").textContent=`${arr.filter(r=>r.tipo==="Creche").length} creches`;
  $("#grid").innerHTML=arr.length ? arr.map(card).join("") :
    `<div class="empty"><div style="font-size:38px;margin-bottom:8px">🔎</div><strong>Nenhuma unidade encontrada.</strong><br>Altere a busca ou limpe os filtros.</div>`;
}

function findById(id){ return DATA.find(r=>idFor(r)===id); }
function detailBlock(label,value,wide=false){
  if(!validText(value)) return "";
  return `<div class="detail ${wide?"wide":""}"><div class="label">${esc(label)}</div><div class="value">${esc(value).replace(/\n/g,"<br>")}</div></div>`;
}
function detailPhone(label,name,phone){
  if(!validText(name) && !validText(phone)) return "";
  return `<div class="detail"><div class="label">${esc(label)}</div>
    <div class="value">${esc(display(name))}</div>${phoneActions(phone)}</div>`;
}
function openModal(r){
  const isCreche=r.tipo==="Creche";
  $("#modalBadge").innerHTML=`<span class="badge ${isCreche?"creche":"school"}">${esc(r.tipo)}</span>`;
  $("#modalTitle").textContent=r.unidade;
  const map=googleMapsHref(r.endereco);
  $("#modalBody").innerHTML=`
    <div class="detail-grid">
      ${detailBlock("Código INEP",r.inep)}
      ${detailBlock("Bairro",r.bairro)}
      <div class="detail"><div class="label">Telefone da unidade</div>${phoneActions(r.telefone_unidade)||'<div class="value">—</div>'}</div>
      ${detailPhone("Diretor(a)",r.diretor,r.telefone_diretor)}
      ${detailPhone("Diretor(a) adjunto(a) 1",r.adjunto1,r.telefone_adjunto1)}
      ${detailPhone("Diretor(a) adjunto(a) 2",r.adjunto2,r.telefone_adjunto2)}
      ${detailBlock("Endereço",r.endereco,true)}
    </div>
    <div class="modal-actions">
      ${phoneHref(r.telefone_unidade)?`<a class="action-primary" href="${phoneHref(r.telefone_unidade)}">☎ Ligar para a unidade</a>`:""}
      ${whatsappHref(r.telefone_unidade)?`<a class="action-secondary" href="${whatsappHref(r.telefone_unidade)}" target="_blank" rel="noopener">WhatsApp</a>`:""}
      ${map?`<a class="action-secondary" href="${map}" target="_blank" rel="noopener">📍 Abrir no Maps</a>`:""}
      <button class="action-secondary" id="copyDetail">Copiar dados</button>
    </div>`;
  $("#copyDetail").onclick=()=>copyText(summaryText(r),"Dados copiados");
  $("#modalBackdrop").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeModal(){
  $("#modalBackdrop").classList.remove("open");
  document.body.style.overflow="";
}
function summaryText(r){
  const lines=[
    r.unidade, `${r.tipo}${validText(r.bairro)?` — ${r.bairro}`:""}`,
    validText(r.inep)?`INEP: ${r.inep}`:"",
    validText(r.telefone_unidade)?`Telefone da unidade: ${r.telefone_unidade}`:"",
    validText(r.diretor)?`Diretor(a): ${r.diretor}${validText(r.telefone_diretor)?` — ${r.telefone_diretor}`:""}`:"",
    validText(r.adjunto1)?`Adjunto(a) 1: ${r.adjunto1}${validText(r.telefone_adjunto1)?` — ${r.telefone_adjunto1}`:""}`:"",
    validText(r.adjunto2)?`Adjunto(a) 2: ${r.adjunto2}${validText(r.telefone_adjunto2)?` — ${r.telefone_adjunto2}`:""}`:"",
    validText(r.endereco)?`Endereço: ${r.endereco.replace(/\n/g," ")}`:""
  ].filter(Boolean);
  return lines.join("\n");
}

$("#search").addEventListener("input",e=>{state.search=e.target.value;render()});
$("#clearSearch").onclick=()=>{$("#search").value="";state.search="";$("#search").focus();render()};
$$(".chip[data-type]").forEach(btn=>btn.onclick=()=>{
  $$(".chip[data-type]").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); state.type=btn.dataset.type; render();
});
$("#favoriteFilter").onclick=e=>{
  state.favoritesOnly=!state.favoritesOnly;e.currentTarget.classList.toggle("active",state.favoritesOnly);render();
};
$("#bairroFilter").onchange=e=>{state.bairro=e.target.value;render()};
$("#sortBy").onchange=e=>{state.sort=e.target.value;render()};
$("#clearFilters").onclick=()=>{
  state.type="Todos";state.favoritesOnly=false;state.bairro="";state.search="";state.sort="unidade";
  $("#search").value="";$("#bairroFilter").value="";$("#sortBy").value="unidade";
  $$(".chip[data-type]").forEach(b=>b.classList.toggle("active",b.dataset.type==="Todos"));
  $("#favoriteFilter").classList.remove("active");render();
};
$("#printBtn").onclick=()=>window.print();

$("#grid").addEventListener("click",e=>{
  const copy=e.target.closest("[data-copy]");
  if(copy){copyText(copy.dataset.copy,"Telefone copiado");return}
  const fav=e.target.closest("[data-fav]");
  if(fav){
    const id=fav.dataset.fav;
    favorites.has(id)?favorites.delete(id):favorites.add(id);
    localStorage.setItem(favoriteKey,JSON.stringify([...favorites]));render();return;
  }
  const det=e.target.closest("[data-detail]");
  if(det){const r=findById(det.dataset.detail);if(r)openModal(r);return}
  const cp=e.target.closest("[data-copy-card]");
  if(cp){const r=findById(cp.dataset.copyCard);if(r)copyText(summaryText(r),"Resumo copiado");}
});
$("#modalBody").addEventListener("click",e=>{
  const copy=e.target.closest("[data-copy]");
  if(copy) copyText(copy.dataset.copy,"Telefone copiado");
});
$("#modalClose").onclick=closeModal;
$("#modalBackdrop").onclick=e=>{if(e.target===$("#modalBackdrop"))closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

fillBairros();
render();
</script>
</body>
</html>
